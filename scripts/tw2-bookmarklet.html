<!DOCTYPE html>
<html>
<head><title>TW2 Route Extractor</title></head>
<body style="font-family:system-ui;max-width:800px;margin:40px auto;padding:20px">
<h1>TW2 Route Extractor</h1>

<h2>Quick Test (try first)</h2>
<p style="padding:15px;background:#f0f0f0;border-radius:8px">
<a href="javascript:void(async function(){const s=document.createElement('div');s.style='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:%23333;color:white;padding:12px 24px;border-radius:8px;z-index:99999;font-size:13px;font-family:system-ui;max-width:90vw';document.body.appendChild(s);const layers=['UCRLines','BOATLines','UCRMidPoints','BOATMidPoints'];const bbox='-210000,7274000,-206000,7278000,EPSG:3857';for(const layer of layers){s.textContent='Testing '+layer+'...';try{const r=await fetch('/api/mapserver/trailwise?service=WFS&version=2.0.0&request=GetFeature&typeNames='+layer+'&outputFormat=geojson&srsName=EPSG:3857&BBOX='+bbox);const t=await r.text();s.textContent=layer+': '+r.status+' len='+t.length+' '+t.slice(0,150);console.log(layer,r.status,t.slice(0,500))}catch(e){s.textContent=layer+': ERR '+e.message}await new Promise(r=>setTimeout(r,4000))}s.textContent='Done - check browser console for full output';setTimeout(()=>s.remove(),8000)})()">
  <strong style="padding:8px 16px;background:#e9c46a;color:#333;border-radius:6px;text-decoration:none">Quick Test</strong>
</a>
</p>

<h2>Full Extract (after test works)</h2>
<p style="padding:15px;background:#f0f0f0;border-radius:8px">
<a href="javascript:void(async function(){try{const s=document.createElement('div');s.style='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:%232d6a4f;color:white;padding:12px 24px;border-radius:8px;z-index:99999;font-size:14px;font-family:system-ui';document.body.appendChild(s);const all=[];const bboxes=['-325000,7050000,-175000,7250000,EPSG:3857','-175000,7050000,-50000,7250000,EPSG:3857','-325000,7250000,-175000,7450000,EPSG:3857','-175000,7250000,-50000,7450000,EPSG:3857'];let chunk=0;for(const bbox of bboxes){for(const layer of['UCRMidPoints','BOATMidPoints']){chunk++;s.textContent='Chunk '+chunk+'/8: '+layer+' ('+all.length+' found)';try{const r=await fetch('/api/mapserver/trailwise?service=WFS&version=2.0.0&request=GetFeature&typeNames='+layer+'&outputFormat=geojson&srsName=EPSG:3857&BBOX='+bbox);if(!r.ok)continue;const d=await r.json();if(d.features){for(const f of d.features){const guid=f.properties.RouteGUID||f.properties.GUID||f.properties.route_guid||'';const twuid=f.properties.TWUID||f.properties.twuid||f.properties.Name||'';if(guid&&!all.find(x=>x.guid===guid)){const c=f.geometry&&f.geometry.coordinates?f.geometry.coordinates:null;all.push({guid,twuid,type:layer.includes('UCR')?'UCR':'BOAT',x:c?c[0]:null,y:c?c[1]:null})}}}}catch(e){console.log(layer+' error:',e)}await new Promise(r=>setTimeout(r,500))}}s.textContent='Downloading '+all.length+' routes...';const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tw2-routes.json';a.click();s.textContent='Done! '+all.length+' routes.';setTimeout(()=>s.remove(),10000)}catch(e){alert('Error: '+e.message)}})()">
  <strong style="font-size:18px;padding:12px 24px;background:#2d6a4f;color:white;border-radius:6px;text-decoration:none;display:inline-block">Extract All TW2 Routes</strong>
</a>
</p>

<h2>Instructions</h2>
<ol>
<li>Go to <a href="https://www.trailwise2.co.uk/route/map" target="_blank">TW2 map</a> (logged in)</li>
<li>Try the yellow <strong>Quick Test</strong> first - watch the status bar</li>
<li>If any layer shows data (not 500 error), use the green <strong>Extract All</strong></li>
</ol>
</body>
</html>
